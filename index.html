<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>CSU-TAPS Data 2024-2025</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:,">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark">TAPS</div>
    <div>
      <div class="brand-title">CSU-TAPS Sprinkler Corn Data, 2024 and 2025</div>
      <div class="brand-sub">Colorado State University, Testing Ag Performance Solutions. Data organized by Wub Yilma</div>
    </div>
  </div>
  <div class="who" id="who" hidden><span id="whoEmail"></span><button id="logoutBtn" class="btn ghost">Sign out</button></div>
</header>

<section id="login" class="login">
  <form id="loginForm" class="card login-card" autocomplete="on">
    <h1>Sign in</h1>
    <p class="muted">Access is limited to invited users. Data is decrypted in your browser after you sign in.</p>
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
    <p id="loginMsg" class="msg" role="alert"></p>
  </form>
</section>

<div id="app" class="app" hidden>
  <nav class="side" id="nav"></nav>
  <main class="main">
    <div class="page-head">
      <div><h2 id="pageTitle"></h2><p id="pageNote" class="muted"></p></div>
      <div class="head-actions">
        <button class="btn" id="pngBtn" title="Save the chart as an image">Chart image</button>
        <button class="btn" id="csvChartBtn" title="Download the values shown in the chart">Chart data (CSV)</button>
        <button class="btn primary" id="csvBtn" title="Download the filtered rows">Filtered rows (CSV)</button>
        <button class="btn primary" id="xlsxBtn" title="Download the filtered rows as Excel">Filtered rows (Excel)</button>
      </div>
    </div>
    <div class="chart-wrap card"><div id="chart" class="chart"></div><div id="chartMsg" class="chart-msg"></div></div>
    <div class="card table-card">
      <div class="table-head"><strong id="tableTitle">Data</strong><span id="tableInfo" class="muted"></span></div>
      <div class="table-scroll"><table id="table"></table></div>
    </div>
  </main>
  <aside class="panel" id="panel"></aside>
</div>

<div id="busy" class="busy" hidden><div class="spinner"></div><div id="busyMsg">Loading</div></div>

<script src="vendor/echarts.min.js"></script>
<script src="js/crypto.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
